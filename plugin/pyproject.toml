[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-droid"
version = "0.1.0"
description = "Autonomous physical testbed and on-device companion node for Hermes Agent"
readme = "README.md"
authors = [{ name = "dalroot" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.0.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0"
]

[tool.setuptools]
py-modules = ["bridge", "handlers", "schemas"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]
