name: CI / CD & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-plugin:
    name: Hermes Plugin Standards & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paho-mqtt requests pytest ruamel.yaml pyyaml

      - name: Run Plugin Unit Tests
        run: |
          PYTHONPATH=. python3 -m unittest discover plugin/tests

      - name: Validate Plugin YAML syntax & schema
        run: |
          python3 -c "
          import yaml
          with open('plugin/plugin.yaml') as f:
              data = yaml.safe_load(f)
          assert data['name'] == 'hermes-droid'
          assert len(data['provides_tools']) == 18
          print('plugin.yaml successfully verified: 18 tools declared')
          "

  build-android:
    name: Android Node Build & ProGuard Shrink
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Compile Release APK (with ProGuard/R8)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Verify Zero Hardcoded Secrets in APK Bytecode
        run: |
          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"
          echo "Inspecting $APK_FILE for leaked bot credentials..."
          unzip -p "$APK_FILE" classes.dex | strings | grep -iE "(bot[0-9]{8,10}:[a-zA-Z0-9_-]{35})" && {
            echo "SECURITY FAILURE: Bot token detected in APK bytecode!"
            exit 1
          } || {
            echo "SECURITY SUCCESS: Zero credentials detected in release bytecode."
          }

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesDroid-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
